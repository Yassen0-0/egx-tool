# EGX bundle: host-plane rows, applied after the web-app bundle.
#
# EGX_HOME must point at the egx checkout (set by scripts/install-desktop.sh in
# ~/.dsh/.env). The MCP server is a host row so one instance serves every
# session: mcp-client server names must be unique across live instances, which a
# per-session preset row would violate.

- insert:
    - id: egx-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: egx
        command: !!js "process.env.EGX_UV ?? 'uv'"
        args: !!js "['run', '--quiet', '--directory', `${process.env.EGX_HOME}/mcp`, 'egx-mcp']"
        env: !!js "({ EGX_DATA_DIR: process.env.EGX_DATA_DIR ?? `${process.env.EGX_HOME}/data` })"
        cwd: !!js "process.env.EGX_HOME"
        toolCallTimeoutMs: 120000
        failOnStartupError: false

    # The portfolio panel: this row's host half serves /egx/api/*, and the
    # package's client.js (dsh.client) adds the sidebar entry and page.
    - id: egx-portfolio
      name: dsh-egx-bundle

# New sessions start with the EGX analyst preset; users can still pick another
# preset from the session menu.
- id: agent-preset-registry
  config:
    default: egx-analyst
