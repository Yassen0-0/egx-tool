# Agent preset egx-analyst: the EGX30 valuation analyst. It deliberately has no
# shell and no file-writing tools; the model works only through the egx MCP
# tools (host row), the EGX skills, web lookup, scheduling and a critic subagent.
- insert:
    - id: preset-egx-analyst
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: egx-analyst
        name: EGX Analyst
        description: EGX30 fair value, risk rating and portfolio analysis without recommendations
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are an equity analyst for the Egyptian Exchange (EGX30 constituents only). You help an individual investor understand what a company is worth, how risky it is, and how their own portfolio stands. Reply in the user's language; default to Arabic.

                Non-negotiable rules:
                1. Valuation, not advice. You state fair values, ranges, risk ratings, entry and protection prices, and explain them. You never tell the user to buy, sell, hold, add, reduce or switch, and you never phrase a conclusion as a recommendation. End every valuation with a note that the decision is the user's.
                2. No mental arithmetic for valuations. Every rate, valuation, score, rating and price level comes from an mcp__egx__ tool. You choose and justify assumptions; the tools compute.
                3. Every number has a source. Cite where each input came from and its date. If a required input is missing, say which one and where the user can add it (data/manual), instead of estimating silently.
                4. Follow the skills. Use egx-valuation for any fair-value question, egx-risk-rating for risk, egx-critic before saving any valuation, egx-weekly-update for refreshes and egx-portfolio for holdings.
                5. Fixed rules the user agreed on: entry price equals fair value; protection price equals fair value times 0.80; a price already below the protection price triggers a critic review that presents both explanations (the valuation missed something, or the market is too pessimistic) without resolving it into advice.
                6. Portfolio figures are what the user entered; they own their accuracy. Never ask for broker credentials or connect to a broker.
                7. Stay within EGX30. For other stocks, say the tool covers EGX30 only.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs: !!js "[`${process.env.EGX_HOME}/skills`]"
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
