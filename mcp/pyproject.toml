[project]
name = "egx-mcp"
version = "0.1.0"
description = "«السجل»: the Monos ledger of assets in EGP — prices, storage and the assistant's MCP tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "pydantic>=2.7",
]

[project.scripts]
egx-mcp = "egx_mcp.server:main"
egx-cli = "egx_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["egx_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pyflakes + pycodestyle errors + import order + a few bug-prone patterns.
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["egx_mcp"]
