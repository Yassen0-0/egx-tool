<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الحالات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.t-light,.t-dark{font-family:var(--dsw-font-family);--dsw-font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","Segoe UI","Geeza Pro",sans-serif;--ds-font-family-code:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;--dsw-radius-xs:4px;--dsw-radius-sm:8px;--dsw-radius-md:12px;--dsw-radius-lg:16px;--dsw-radius-xl:20px;background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary);min-height:100vh;direction:rtl}
.t-light{--dsw-alias-bg-base:#FFFFFF;--dsw-alias-bg-layer-1:#FFFFFF;--dsw-alias-bg-layer-2:#FFFFFF;--dsw-alias-bg-layer-3:#FFFFFF;--dsw-alias-bg-module-platform:#F5F6F7;--dsw-alias-bg-overlay:#E9ECF2;--dsw-alias-bg-skeleton:rgba(0,0,0,.04);--dsw-alias-border-l1:rgba(0,0,0,.04);--dsw-alias-border-l2:rgba(0,0,0,.10);--dsw-alias-border-l3:rgba(0,0,0,.12);--dsw-alias-border-l4:rgba(0,0,0,.16);--dsw-alias-brand-primary:#0F1115;--dsw-alias-button-primary-fill:#0F1115;--dsw-alias-button-primary-hover:#43454A;--dsw-alias-label-primary-foreground:#FFFFFF;--dsw-alias-button-ghost-active-fill:#EBEEF2;--dsw-alias-button-ghost-active-border:#979DA6;--dsw-alias-interactive-bg-hover:rgba(38,49,72,.06);--dsw-alias-interactive-bg-active:rgba(38,49,72,.10);--dsw-alias-label-primary:#0F1115;--dsw-alias-label-secondary:#61666B;--dsw-alias-label-tertiary:#81858C;--dsw-alias-label-caption:#ADB2B8;--dsw-alias-link:#4176E6;--dsw-alias-state-business-primary:#4176E6;--dsw-alias-state-business-tertiary:#E4EDFD;--dsw-alias-state-success-primary:#22C55E;--dsw-alias-state-success-tertiary:#E6FAED;--dsw-alias-state-error-primary:#EC1313;--dsw-alias-state-warn-primary:#F59E0B;--dsw-alias-state-warn-label:#DD8629;--dsw-alias-state-warn-tertiary:#FEF5E7;--dsw-alias-file-diff-added-marker:#01A241;--dsw-alias-file-diff-deleted-marker:#BA2723;--dsw-alias-markdown-code-block:#F9FAFB;--dsw-alias-markdown-tag:#F1F3F5;--dsw-specific-sidebar-fill:#F9FAFB;--dsw-specific-sidebar-nav-item-active:#EBEEF2;--dsw-specific-sidebar-nav-item-hover:#F1F3F5;--dsw-specific-input-major:#FFFFFF;--dsw-alias-tooltip-bg:#2C2C2E}
.t-dark{--dsw-alias-bg-base:#151517;--dsw-alias-bg-layer-1:#232324;--dsw-alias-bg-layer-2:#2C2C2E;--dsw-alias-bg-layer-3:#353638;--dsw-alias-bg-module-platform:#353638;--dsw-alias-bg-overlay:#61666B;--dsw-alias-bg-skeleton:rgba(255,255,255,.08);--dsw-alias-border-l1:rgba(255,255,255,.06);--dsw-alias-border-l2:rgba(255,255,255,.12);--dsw-alias-border-l3:rgba(255,255,255,.16);--dsw-alias-border-l4:rgba(255,255,255,.20);--dsw-alias-brand-primary:#F9FAFB;--dsw-alias-button-primary-fill:#F9FAFB;--dsw-alias-button-primary-hover:#EBEEF2;--dsw-alias-label-primary-foreground:#0F1115;--dsw-alias-button-ghost-active-fill:#43454A;--dsw-alias-button-ghost-active-border:#81858C;--dsw-alias-interactive-bg-hover:rgba(255,255,255,.08);--dsw-alias-interactive-bg-active:rgba(255,255,255,.14);--dsw-alias-label-primary:#F9FAFB;--dsw-alias-label-secondary:#CFD3D6;--dsw-alias-label-tertiary:#ADB2B8;--dsw-alias-label-caption:#81858C;--dsw-alias-link:#7AAAFF;--dsw-alias-state-business-primary:#7AAAFF;--dsw-alias-state-business-tertiary:#34415B;--dsw-alias-state-success-primary:#22C55E;--dsw-alias-state-success-tertiary:#233C2C;--dsw-alias-state-error-primary:#F25A5A;--dsw-alias-state-warn-primary:#F59E0B;--dsw-alias-state-warn-label:#DD8629;--dsw-alias-state-warn-tertiary:#27241F;--dsw-alias-file-diff-added-marker:#41C977;--dsw-alias-file-diff-deleted-marker:#FA423E;--dsw-alias-markdown-code-block:#1B1B1C;--dsw-alias-markdown-tag:#2C2C2E;--dsw-specific-sidebar-fill:#1B1B1C;--dsw-specific-sidebar-nav-item-active:#43454A;--dsw-specific-sidebar-nav-item-hover:#2C2C2E;--dsw-specific-input-major:#2C2C2E;--dsw-alias-tooltip-bg:#43454A}
.num{font-family:var(--ds-font-family-code);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

*{box-sizing:border-box}
p{margin:0}
button,input,select{font:inherit;color:inherit}
.t-light,.t-dark{font-size:14px;line-height:1.5}
.muted{color:var(--dsw-alias-label-secondary)}.meta{color:var(--dsw-alias-label-tertiary);font-size:12px}
.up{color:var(--dsw-alias-file-diff-added-marker)}.down{color:var(--dsw-alias-file-diff-deleted-marker)}
a{color:var(--dsw-alias-link);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--dsw-alias-state-business-primary);outline-offset:1px}
.phdr{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 20px;border-bottom:1px solid var(--dsw-alias-border-l2);background:var(--dsw-alias-bg-base);flex-wrap:wrap}
.phdr .ttl{font-size:14px;font-weight:600}
.phdr .sep{color:var(--dsw-alias-label-caption)}
.phdr .scr{font-size:14px;color:var(--dsw-alias-label-secondary)}
.phdr .acts{margin-inline-start:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--dsw-alias-label-tertiary);flex-wrap:wrap}
.btn{appearance:none;height:32px;padding:0 14px;border-radius:var(--dsw-radius-sm);border:1px solid var(--dsw-alias-border-l3);background:transparent;color:var(--dsw-alias-label-primary);font-weight:500;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--dsw-alias-interactive-bg-hover);text-decoration:none}
.btn-p{background:var(--dsw-alias-button-primary-fill);border-color:var(--dsw-alias-button-primary-fill);color:var(--dsw-alias-label-primary-foreground)}
.btn-p:hover{background:var(--dsw-alias-button-primary-hover);border-color:var(--dsw-alias-button-primary-hover)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg,.ibtn svg{flex:none}
.ibtn{appearance:none;width:28px;height:28px;border-radius:var(--dsw-radius-sm);border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--dsw-alias-label-secondary)}
.ibtn:hover{background:var(--dsw-alias-interactive-bg-hover);color:var(--dsw-alias-label-primary)}
.inp{height:32px;padding:0 10px;border:1px solid var(--dsw-alias-border-l3);border-radius:var(--dsw-radius-sm);background:var(--dsw-specific-input-major);color:var(--dsw-alias-label-primary);font-size:13px;min-width:0;width:100%}
.inp:hover{border-color:var(--dsw-alias-border-l4)}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:var(--dsw-radius-xs);font-size:12px;background:var(--dsw-alias-markdown-tag);color:var(--dsw-alias-label-secondary);white-space:nowrap}
.chip-ex{background:var(--dsw-alias-markdown-tag);color:var(--dsw-alias-label-secondary);border:1px dashed var(--dsw-alias-border-l4)}
.chip-warn{background:var(--dsw-alias-state-warn-tertiary);color:var(--dsw-alias-state-warn-label);font-weight:500}
.chip-blue{background:var(--dsw-alias-state-business-tertiary);color:var(--dsw-alias-link)}
.card{background:var(--dsw-alias-bg-layer-1);border:1px solid var(--dsw-alias-border-l2);border-radius:var(--dsw-radius-md);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.disc{font-size:12px;color:var(--dsw-alias-label-tertiary);line-height:1.7}
.rl{position:relative;height:16px;direction:ltr;width:100%}
.rl .trk{position:absolute;left:0;right:0;top:7px;height:2px;border-radius:1px;background:var(--dsw-alias-border-l3)}
.rl .trk-d{background:transparent;border-top:2px dashed var(--dsw-alias-border-l3);height:0}
.rl .rng{position:absolute;top:6px;height:4px;border-radius:2px;background:var(--dsw-alias-state-business-tertiary)}
.rl .mk{position:absolute;top:2px;width:2px;height:12px;margin-left:-1px;border-radius:1px}
.rl .mk-f{background:var(--dsw-alias-state-business-primary)}
.rl .mk-p{background:var(--dsw-alias-state-warn-primary)}
.rl .dot{position:absolute;top:3px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--dsw-alias-label-primary);border:2px solid var(--dsw-alias-bg-base)}
.rl .dot-u{background:var(--dsw-alias-state-warn-primary)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dsw-alias-label-secondary);white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;display:inline-block}
.st-above i{background:currentColor}
.st-under{color:var(--dsw-alias-state-warn-label);font-weight:600}
.st-under i{border-radius:1px;transform:rotate(45deg);background:currentColor}

.page{max-width:1180px;margin:0 auto;padding:20px 20px 36px}
h1{font-size:20px;font-weight:600;margin:0}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:24px 20px;margin-top:18px;align-items:start}
.fig{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.cap{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cap b{font-size:14px;font-weight:600}
.cap span{font-size:12px;color:var(--dsw-alias-label-tertiary)}
.pn{background:var(--dsw-alias-bg-layer-1);border:1px solid var(--dsw-alias-border-l2);border-radius:var(--dsw-radius-md);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.mh{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-bottom:1px solid var(--dsw-alias-border-l2);font-size:13px}
.mh b{font-weight:600}.mh .sep{color:var(--dsw-alias-label-caption)}.mh .scr{color:var(--dsw-alias-label-secondary)}
.mh .l{margin-inline-start:auto;font-size:12px;color:var(--dsw-alias-label-tertiary)}
.body{padding:16px}
.ctr{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:36px 24px}
.ctr h2,.ban h2{font-size:16px;font-weight:600;margin:0}
.ctr p{font-size:14px;color:var(--dsw-alias-label-secondary);max-width:380px;line-height:1.7}
.ico{width:40px;height:40px;border-radius:var(--dsw-radius-md);background:var(--dsw-alias-bg-module-platform);display:flex;align-items:center;justify-content:center;color:var(--dsw-alias-label-secondary)}
.cmd{display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 6px 0 14px;border:1px solid var(--dsw-alias-border-l3);border-radius:var(--dsw-radius-sm);background:var(--dsw-alias-markdown-code-block);font-size:14px}
.cmd .btn{height:26px;padding:0 10px;font-size:12px}
.sk{height:12px;border-radius:var(--dsw-radius-xs);background:var(--dsw-alias-bg-skeleton);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.sg{display:grid;grid-template-columns:minmax(0,1.6fr) 1fr 1fr 1fr;column-gap:16px;align-items:center;padding:0 16px}
.sg.h{height:34px;background:var(--dsw-alias-bg-module-platform);font-size:12px;color:var(--dsw-alias-label-secondary);border-bottom:1px solid var(--dsw-alias-border-l2)}
.sg.b{height:52px;border-bottom:1px solid var(--dsw-alias-border-l1)}
.ban{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--dsw-alias-border-l2);border-inline-start-width:3px;border-radius:var(--dsw-radius-sm);background:var(--dsw-alias-bg-module-platform)}
.ban p{font-size:13px;color:var(--dsw-alias-label-secondary);line-height:1.7;margin-top:2px}
.ban .acts{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.ban-e{border-inline-start-color:var(--dsw-alias-state-error-primary)}
.ban-l{border-inline-start-color:var(--dsw-alias-label-tertiary)}
.dh{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dh .s{font-size:20px;font-weight:600;direction:ltr}
.dh .n{font-size:13px;color:var(--dsw-alias-label-secondary)}
.kv{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.kv .k{font-size:12px;color:var(--dsw-alias-label-tertiary)}
.kv .v{font-size:16px;font-weight:600}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 12px;margin-top:14px}
.facts .v{white-space:nowrap}
.rlg{position:relative;height:74px;direction:ltr;margin:6px 14px 0}
.rlg .trk{position:absolute;left:0;right:0;top:34px;height:2px;background:var(--dsw-alias-border-l3);border-radius:1px}
.rlg .rng{position:absolute;top:32px;height:6px;border-radius:3px;background:var(--dsw-alias-state-business-tertiary)}
.rlg .mk{position:absolute;top:26px;width:2px;height:18px;margin-left:-1px;border-radius:1px}
.rlg .dot{position:absolute;top:29px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--dsw-alias-state-warn-primary);border:2px solid var(--dsw-alias-bg-base)}
.rlg .lb{position:absolute;font-size:12px;white-space:nowrap;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;line-height:1.4}
.rlg .lb small{font-size:11px;color:var(--dsw-alias-label-tertiary)}
.warnbox{background:var(--dsw-alias-state-warn-tertiary);border:1px solid var(--dsw-alias-state-warn-primary);border-radius:var(--dsw-radius-sm);padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.warnbox h2{font-size:14px;font-weight:600;margin:0;color:var(--dsw-alias-state-warn-label)}
.warnbox p{font-size:13px;color:var(--dsw-alias-label-primary);margin-top:2px;line-height:1.6}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{border:1px solid var(--dsw-alias-border-l2);border-radius:var(--dsw-radius-sm);padding:10px 12px;background:var(--dsw-alias-bg-layer-1)}
.opt h3{font-size:13px;font-weight:600;margin:0 0 4px}
.opt p{font-size:13px;color:var(--dsw-alias-label-secondary);line-height:1.7}
.tip{display:inline-block;padding:8px 10px;border-radius:var(--dsw-radius-sm);background:var(--dsw-alias-tooltip-bg);color:var(--dsw-alias-label-primary-foreground);font-size:12px;line-height:1.6;max-width:300px}
.t-dark .tip{color:var(--dsw-alias-label-primary)}
.lr{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 1.3fr;column-gap:12px;align-items:center;padding:0 16px;min-height:54px;border-bottom:1px solid var(--dsw-alias-border-l1);font-size:13px}
.lr.h{min-height:34px;background:var(--dsw-alias-bg-module-platform);font-size:12px;color:var(--dsw-alias-label-secondary);border-bottom:1px solid var(--dsw-alias-border-l2)}
.r{text-align:right}
.two{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.two small{font-size:12px;color:var(--dsw-alias-label-tertiary)}
.chip-demo{background:var(--dsw-alias-bg-module-platform);color:var(--dsw-alias-label-secondary)}
.chipw{position:relative;display:inline-flex}
.chipw .tip{display:none;position:absolute;top:26px;inset-inline-start:0;z-index:5;width:280px}
.chipw:hover .tip,.chipw:focus-within .tip{display:block}
.help{background:var(--dsw-alias-bg-module-platform);border-radius:var(--dsw-radius-sm);padding:8px 12px;font-size:13px;line-height:1.7;color:var(--dsw-alias-label-secondary);margin-top:10px}
.dash{border-top:2px dashed var(--dsw-alias-border-l3);height:0;margin:12px 0}
</style>
</helmet>
<div class="t-{{theme}}">
<div class="page">
  <h1>الحالات الأساسية</h1>
  <p class="muted" style="margin-top: 4px">كل بطاقة بحجم محتوى اللوحة. تسع حالات تغطي التحميل والفراغ والخطأ ونقص البيانات والحماية والقِدم. أيقونة «قيمة» خضراء لأن محفظة العرض طالعة اليوم، ومحايدة حين لا توجد مراكز أو أسعار محدّثة.</p>

  <div class="gal">
    <figure class="fig">
      <figcaption class="cap"><b>01 · جارٍ التحميل</b><span>هياكل بنفس أبعاد الصفوف، فلا يقفز التخطيط</span></figcaption>
      <div class="pn" aria-busy="true" aria-label="جارٍ تحميل الأسعار">
        <div class="mh"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex:none"><rect width="24" height="24" rx="6" style="fill: var(--dsw-alias-file-diff-added-marker)"></rect><path d="M12 18.5V6M6.5 11.5L12 6l5.5 5.5" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--dsw-alias-bg-base)"></path></svg><b>قيمة</b><span class="sep">/</span><span class="scr">السوق</span><span class="chip chip-demo">بيانات تجريبية</span><span class="l">جارٍ جلب الإغلاقات…</span></div>
        <div class="sg h"><span>السهم</span><span class="r">آخر سعر</span><span class="r">التغير</span><span>الحالة</span></div>
        <sc-for list="{{sk}}" as="k" hint-placeholder-count="7">
          <div class="sg b">
            <div style="display: flex; flex-direction: column; gap: 6px"><div class="sk" style="width: 44px"></div><div class="sk" style="width: {{k.a}}px; height: 10px"></div></div>
            <div style="display: flex; justify-content: flex-end"><div class="sk" style="width: 56px"></div></div>
            <div style="display: flex; justify-content: flex-end"><div class="sk" style="width: {{k.b}}px"></div></div>
            <div class="sk" style="width: {{k.c}}px"></div>
          </div>
        </sc-for>
      </div>
    </figure>
    <figure class="fig">
      <figcaption class="cap"><b>02 · لا توجد تحليلات بعد</b><span>يخبر المستخدم بما يكتبه في المحادثة بالضبط</span></figcaption>
      <div class="pn">
        <div class="mh"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex:none"><rect width="24" height="24" rx="6" style="fill: var(--dsw-alias-file-diff-added-marker)"></rect><path d="M12 18.5V6M6.5 11.5L12 6l5.5 5.5" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--dsw-alias-bg-base)"></path></svg><b>قيمة</b><span class="sep">/</span><span class="scr">التحليلات</span><span class="chip chip-demo">بيانات تجريبية</span></div>
        <div class="ctr">
          <div class="ico"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h9A1.5 1.5 0 0 1 16 5.5v6a1.5 1.5 0 0 1-1.5 1.5H9l-3.5 3v-3h0A1.5 1.5 0 0 1 4 11.5z"></path></svg></div>
          <h2>لا توجد تحليلات محفوظة بعد</h2>
          <p>التقييم يتم في المحادثة وليس هنا. اكتب هذه الجملة هناك، وسيظهر الناتج في هذه الصفحة مع نطاقه وسعر الحماية.</p>
          <div class="cmd"><span>«قيّم سهم COMI»</span><button type="button" class="btn" onClick="{{copy}}">{{copyLabel}}</button></div>
          <span class="meta">أمثلة أخرى: «قيّم سهم TMGH» · «قيّم سهم EAST»</span>
          <a class="btn btn-p" href="#" style="margin-top: 6px">افتح المحادثة</a>
        </div>
      </div>
    </figure>
    <figure class="fig">
      <figcaption class="cap"><b>03 · خطأ في الأسعار</b><span>فشل التحديث، وبلوغ الحد اليومي. آخر بيانات سليمة تبقى ظاهرة</span></figcaption>
      <div class="pn">
        <div class="mh"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex:none"><rect width="24" height="24" rx="6" style="fill: var(--dsw-alias-file-diff-added-marker)"></rect><path d="M12 18.5V6M6.5 11.5L12 6l5.5 5.5" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--dsw-alias-bg-base)"></path></svg><b>قيمة</b><span class="sep">/</span><span class="scr">السوق</span><span class="chip chip-demo">بيانات تجريبية</span><span class="l">تحديثات الأسعار اليوم <span class="num">14</span> من <span class="num">20</span></span></div>
